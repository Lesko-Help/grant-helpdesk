# Read by ~/.werk/wt-new.sh when it cuts a worktree. Ignored files never travel
# with a worktree, so these are brought in: a file is copied (a credential must
# be a real file), a folder is symlinked to the one in the main checkout.
#   .df-credentials.json    Dataform credentials — without it nothing compiles
#   .streamlit/secrets.toml the app's secrets — without it the app cannot start
WT_CARRY=".df-credentials.json .streamlit/secrets.toml"

# Every task argues product, architecture and program design in the brief
# before code (gates 1-3), then builds in proved slices (gate 4); the
# overseer's agentic review applies above its default threshold. This is a
# product repo with users: a bad line of a plan is hundreds of bad lines of
# code. Override per task: WT_STAGES=midden wt-new.sh <name> "<goal>".
WT_STAGES="groot"

# Window 7 of the tmux session: the four standing docs, always one key away.
WERK_WINDOWS=""
