# Read by ~/.werk/wt-new.sh when it cuts a worktree. Ignored files never travel
# with a worktree, so these are brought in: a file is copied (a credential must
# be a real file), a folder is symlinked to the one in the main checkout.
#   .df-credentials.json    Dataform credentials — without it nothing compiles
#   .streamlit/secrets.toml the app's secrets — without it the app cannot start
WT_CARRY=".df-credentials.json .streamlit/secrets.toml"
